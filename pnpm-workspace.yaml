packages:
  - apps/*
  - packages/*
  - core/*

# Keep each app and its peer dependencies isolated. Web uses React 19;
# mobile uses React 18. Metro export is verified; native builds are separate.
nodeLinker: isolated
packageExtensions:
  # Router 4 imports query-string but does not declare it. Newer navigation
  # releases no longer provide the incidental hoisted copy it relied on.
  expo-router@4.0.22:
    dependencies:
      query-string: ^7.1.3
onlyBuiltDependencies:
  - electron
  - sharp
  - esbuild
